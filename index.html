<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Shopping Cart</title>
    <link rel="stylesheet" href="Style1.css">
</head>
<body>
    <div class="container">
        <h1>Advanced Shopping Cart</h1>
        
        <div class="input-section">
            <h3>Add Product</h3>
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="productName" placeholder="e.g. Laptop">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="productPrice" placeholder="e.g. 1200">
            </div>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="cart-section">
            <div class="cart-header">
                <h3>Cart Items</h3>
                <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price (₹)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="cartTableBody">
                </tbody>
            </table>
            <p id="emptyMessage">Your cart is empty.</p>
        </div>

        <div class="summary-section">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Items: <span id="itemCount">0</span></span>
            </div>
            <div class="summary-row">
                <span>Subtotal:</span>
                <span>₹<span id="subtotal">0.00</span></span>
            </div>
            <div class="summary-row">
                <span>Discount (10%):</span>
                <span>-₹<span id="discount">0.00</span></span>
            </div>
            <div class="summary-row total">
                <span>Total Payable:</span>
                <span>₹<span id="total">0.00</span></span>
            </div>
            <div class="stats-row">
                <span>Max Value: ₹<span id="maxValue">0.00</span></span>
                <span>Min Value: ₹<span id="minValue">0.00</span></span>
            </div>
        </div>
    </div>
    <script src="script1.js"></script>
    <div style="position: fixed; bottom: 10px; right: 10px; font-family: sans-serif; fontsize: 14px; color: #da1111; background-color: rgba(255, 208, 0, 0.8); padding: 5px 10px;
border-radius: 4px; z-index: 1000;">
 Name: M HUSSAIN KHAN <br>

</div> 
</body>
</html>
